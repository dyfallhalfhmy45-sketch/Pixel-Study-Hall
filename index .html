<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Study Hall · قاعة الدراسة</title>
<style>
:root{--bg:#1d1a33;--panel:#2b2650;--ink:#f2e9d8;--lamp:#ffb454;--mint:#5eead4;--rose:#ff6b8b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
header,#meter,#help{width:min(100%,960px)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.25rem;color:var(--lamp)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;background:var(--panel);color:var(--ink);border:2px solid #4a4380;border-radius:4px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--lamp)}button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button.on{background:var(--rose);border-color:var(--rose);color:#1d1a33}
#meter{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;background:#0006;border:2px solid #4a4380;border-radius:2px}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .4s}
canvas{width:min(100%,960px);aspect-ratio:8/5;image-rendering:pixelated;border:4px solid #4a4380;border-radius:6px;background:#000;touch-action:none}
#help{color:#bdb4d8;font-size:.85rem;margin:0}
#lobby{position:fixed;inset:0;background:#1d1a33f2;display:grid;place-items:center;padding:16px;z-index:5}
#lobby form{background:var(--panel);border:3px solid var(--lamp);border-radius:8px;padding:20px;width:min(100%,380px);display:grid;gap:10px}
#lobby h2{margin:0;color:var(--lamp)}
input{font:inherit;padding:8px;border-radius:4px;border:2px solid #4a4380;background:#1d1a33;color:var(--ink)}
.go{background:var(--lamp);color:#1d1a33;border-color:var(--lamp);font-weight:700;padding:8px}
small{color:#bdb4d8}
#toast{position:fixed;bottom:14px;background:var(--rose);color:#1d1a33;padding:6px 14px;border-radius:4px;display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

#side{width:min(100%,960px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.pn{background:var(--panel);border:2px solid #4a4380;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pn h3{margin:0;color:var(--lamp);font-size:1rem}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#lb{list-style:none;margin:0;padding:0;display:grid;gap:4px}#lb li{display:flex;align-items:center;gap:8px;background:#0003;padding:2px 8px;border-radius:4px}
#lb li.me{outline:2px solid var(--lamp)}#lb b{flex:1;overflow:hidden;text-overflow:ellipsis}#lb em{color:var(--mint);font-style:normal;font-weight:700}
#log{height:120px;overflow:auto;background:#0003;border-radius:4px;padding:6px;font-size:.85rem}#log b{color:var(--mint)}
#cf{display:flex;gap:6px}#cf input{flex:1;min-width:0}
.pn select{font:inherit;background:#1d1a33;color:var(--ink);border:2px solid #4a4380;border-radius:4px;padding:4px;max-width:100%}
#books{grid-column:1/-1}.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane{position:relative;height:300px;border:3px solid var(--mint);border-radius:4px;background:#0004;overflow:hidden}.pane.mine{border-color:var(--lamp)}
.pane iframe{width:100%;height:100%;border:0;background:#fff}.pane canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pane b{position:absolute;top:2px;inset-inline-start:6px;z-index:2;background:#000a;padding:0 6px;border-radius:3px;font-size:.8rem}
.zoom{position:absolute;top:2px;inset-inline-end:4px;z-index:2;padding:0 6px}
.pane.big{position:fixed;inset:4vh 4vw;height:auto;z-index:8}
#dlg{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:9;padding:12px}
#dc{background:var(--panel);border:3px solid var(--lamp);border-radius:8px;padding:18px;width:min(100%,420px);display:grid;gap:10px;text-align:center}
#dc .row{justify-content:center}#dc button{font-size:1.3rem}.ib{min-width:56px}
@media(max-width:640px){.shelf{grid-template-columns:1fr}}

.btn,label.up{background:var(--panel);border:2px solid #4a4380;border-radius:4px;padding:4px 10px;cursor:pointer}
label.up{background:var(--lamp);color:#1d1a33;border-color:var(--lamp);font-weight:700}
#gl{list-style:none;margin:0;padding:0;display:grid;gap:4px}#gl li{display:flex;align-items:center;gap:8px;background:#0003;padding:2px 8px;border-radius:4px}
#gl b{flex:1;overflow:hidden;text-overflow:ellipsis}#gl em{color:var(--mint);font-style:normal}#lb li,#gl li{cursor:pointer}#hist{font-size:.8rem;color:#bdb4d8}
.nav{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:4px;align-items:center;background:#000a;border-radius:3px;padding:0 4px;font-size:.8rem}.nav button{padding:0 8px}
.stage{position:absolute;inset:26px 0 0 0;overflow:auto}.sheet{position:relative}.pane .pg{position:static;display:block;width:100%;height:auto;background:#fff;pointer-events:none}
.pane canvas{background:transparent;border:0;border-radius:0;aspect-ratio:auto;image-rendering:auto}.pane .pg{background:#fff}
#dc canvas{width:100%;background:#4f4070;border-radius:4px;image-rendering:pixelated}

.site{margin:0;font-size:1.8rem;color:var(--lamp);text-align:center}.logo{font-size:2.4rem;text-align:center}
#lobby form{width:min(100%,600px)}.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.prof label,.mode label{display:grid;gap:2px;font-size:.85rem}
#lobby select,#lobby input{width:100%;min-width:0;font:inherit;background:#1d1a33;color:var(--ink);border:2px solid #4a4380;border-radius:4px;padding:8px}#lobby input[type=file]{padding:5px;font-size:.8rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{background:#0003;border:2px solid #4a4380;border-radius:6px;padding:10px;display:grid;gap:8px;align-content:start}.mode h3{margin:0;color:var(--lamp)}
@media(max-width:560px){.modes{grid-template-columns:1fr}}
body.solo .g-only{display:none!important}body.group .s-only{display:none!important}body.solo .shelf{grid-template-columns:1fr}
.sc{width:18px;height:18px;padding:0;border:2px solid #0006;border-radius:50%}#sw{gap:3px}#tm{font-weight:700;color:var(--mint);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <div class="btns">
    <label class="up"><span data-x="upl"></span><input type="file" id="pf" accept="application/pdf" hidden></label><span id="tm"></span><button id="bEnd" data-x="end"></button><button id="bLang">EN</button>
    <button class="g-only" id="bMic" data-i="mic"></button>
    <button id="bSit" data-i="sit"></button>
    <button id="bZz" data-i="zz"></button>
  </div>
</header>
<div id="meter" class="g-only"><span id="mt"></span><div class="bar"><i id="mb"></i></div></div>
<canvas id="c" width="960" height="600" aria-label="room"></canvas>
<p id="help" data-i="help"></p>

<section id="side">
<div class="pn"><h3 data-x="board"></h3><div id="clock"></div><ol id="lb"></ol><h3 data-x="world"></h3><div class="row"><select id="gf"></select></div><ol id="gl"></ol></div>
<div class="pn g-only"><h3 data-x="chat"></h3><div id="log"></div><form id="cf"><input id="ci" maxlength="120" data-p="ph"><button>➤</button></form></div>
<div class="pn"><h3 data-x="wardrobe"></h3>
<div class="row"><button data-o="thobe" data-x="thobe"></button><button data-o="suit" data-x="suit"></button><button data-o="tee" data-x="tee"></button><input type="color" id="col" value="#4aa3ff"></div><div class="row"><label>👤 <input type="color" id="skin" value="#f1c27d"></label><label>💇 <input type="color" id="hair" value="#3a2a1a"></label><select id="trs"><option value="0">🌳</option><option value="1">🌸</option><option value="2">🍂</option><option value="3">🌲</option></select></div><div id="hist"></div>
<div class="g-only"><h3 data-x="quiz"></h3><input id="qq" maxlength="80" data-p="qph">
<div class="row"><input id="qa0" placeholder="A" size="8" maxlength="30"><input id="qa1" placeholder="B" size="8" maxlength="30"><input id="qa2" placeholder="C" size="8" maxlength="30"></div>
<div class="row"><select id="qc"><option value="0">A ✓</option><option value="1">B ✓</option><option value="2">C ✓</option></select><select id="qt"></select><button id="qm">➕ 1+1</button><button id="qs" class="go" data-x="qsend"></button></div></div></div>
<div class="pn" id="books"><h3 data-x="books"></h3>
<div class="row"><button id="pen" hidden></button><button id="nat" data-x="nat"></button><button data-tl="pen" data-x="tpen"></button><button data-tl="hl" data-x="thl"></button><button data-tl="er" data-x="ter"></button><input type="color" id="pc" value="#e63946"><span id="sw" class="row"></span><input type="range" id="pz" min="1" max="5" value="2" style="width:70px"><select id="who" class="g-only"></select></div>
<small data-x="natH"></small><div class="shelf"><div class="pane mine"><b data-x="mine"></b><button class="zoom">⛶</button><div class="nav"><button>‹</button><span></span><button>›</button></div><div class="stage"><div class="sheet"><canvas id="fm" class="pg"></canvas><canvas id="pm" class="ov"></canvas></div></div></div>
<div class="pane g-only"><b data-x="theirs"></b><button class="zoom">⛶</button><div class="nav"><button>‹</button><span></span><button>›</button></div><div class="stage"><div class="sheet"><canvas id="ft" class="pg"></canvas><canvas id="pt" class="ov"></canvas></div></div></div></div></div>
</section>
<div id="dlg"><div id="dc"></div></div>
<div id="toast"></div>

<div id="lobby">
  <form id="f">
    <div class="logo">🕹️</div><h1 class="site" data-i="title"></h1>
    <small data-i="intro"></small>
    <div class="prof">
      <label><span data-i="name"></span><input id="iName" maxlength="12" required></label>
      <label><span data-x="country"></span><select id="cc"></select></label>
      <label><span data-x="photo"></span><input type="file" id="iPh" accept="image/*"></label>
    </div>
    <div class="modes">
      <div class="mode"><h3 data-x="m_solo"></h3><small data-x="m_solo_d"></small><button type="button" id="bSolo" class="go" data-x="solo"></button></div>
      <div class="mode"><h3 data-x="m_grp"></h3><small data-x="m_grp_d"></small>
        <label><span data-i="room"></span><input id="iRoom" maxlength="20" required value="main"></label>
        <label><span data-x="dur"></span><select id="iDur"><option>2</option><option>15</option><option selected>25</option><option>45</option><option>60</option></select></label>
        <button class="go" data-i="join"></button></div>
    </div>
    <button type="button" id="lobbyLang">EN</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ---------- i18n ---------- */
const T={
ar:{title:"قاعة الدراسة بيكسل",intro:"شخصيتك تجلس بجانب أصدقائك. كل ما اقتربت منهم يعلو صوتهم. وإن غادرت التبويب تنام شخصيتك.",name:"اسمك",room:"رمز الغرفة (شاركه مع أصدقائك)",join:"ادخل القاعة",mic:"🎤 المايك",sit:"🪑 اجلس / قف",zz:"💤 جرّب النوم",
help:"حرّك الشخصية بـ WASD أو الأسهم أو بلمس الشاشة. اقترب من مكتب واضغط E للجلوس. غيّر التبويب لتنام شخصيتك.",
focus:"التركيز الجماعي",mute:"🔇 صامت",micOn:"🎤 المايك",noMic:"لا يوجد وصول للمايك. ستسمع الآخرين فقط.",full:"الغرفة ممتلئة (12 كحد أقصى)",joined:"انضم",left:"غادر",you:"أنت"},
en:{title:"Pixel Study Hall",intro:"Your avatar sits beside your friends. Voices get louder as you walk closer. Leave the tab and your avatar falls asleep.",name:"Your name",room:"Room code (share it with friends)",join:"Enter hall",mic:"🎤 Mic",sit:"🪑 Sit / stand",zz:"💤 Test sleep",
help:"Move with WASD, arrow keys or tap the floor. Walk to a desk and press E to sit. Switch tabs and your avatar falls asleep.",
focus:"Group focus",mute:"🔇 Muted",micOn:"🎤 Mic",noMic:"No mic access. You can listen only.",full:"Room is full (12 max)",joined:"joined",left:"left",you:"You"}};
let L=(navigator.language||"").startsWith("ar")?"ar":"en";
const t=k=>T[L][k];
function applyLang(){
  document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  bLang.textContent=lobbyLang.textContent=L==="ar"?"EN":"عربي";
  if(me.muted)bMic.textContent=t("mute");
  document.title=t("title");
}
const toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",2500)};

/* ---------- state ---------- */
const MAX=12,R=170;                       // max peers, hearing radius (px)
const W=320,H=200;
const desks=[[40,70],[110,70],[180,70],[250,70],[40,130],[110,130],[180,130],[250,130]];
const seat=d=>({x:d[0]+14,y:d[1]+24});
const me={x:160,y:170,name:"",hue:0,asleep:false,sit:false,muted:false,tx:null,ty:null};
const peers=new Map();
const keys={};
const $=id=>document.getElementById(id);
const cv=$("c"),g=cv.getContext("2d");
g.imageSmoothingEnabled=false;

/* ---------- networking (PeerJS mesh + spatial audio) ---------- */
let peer,room,stream,actx,micOk=true;
function ensure(id){if(!peers.has(id))peers.set(id,{x:160,y:170,name:"…",hue:200,asleep:false,sit:false});return peers.get(id)}
function send(o){peers.forEach(p=>p.conn&&p.conn.open&&p.conn.send(o))}
let state=()=>({k:"s",x:me.x,y:me.y,sit:me.sit,asleep:me.asleep});
function claim(i){
  if(i>=MAX)return toast(t("full"));
  const p=new Peer(`pshall-${room}-${i}`);
  p.on("open",()=>{peer=p;for(let j=0;j<MAX;j++)if(j!==i)link(`pshall-${room}-${j}`)});
  p.on("error",e=>{if(e.type==="unavailable-id"){p.destroy();claim(i+1)}});   // peer-unavailable is expected and ignored
  p.on("connection",wire);
  p.on("call",c=>{c.answer(stream);listen(c)});
}
function link(id){
  const c=peer.connect(id,{reliable:true});wire(c);
  c.on("open",()=>listen(peer.call(id,stream)));
}
function wire(c){
  c.on("open",()=>{ensure(c.peer).conn=c;c.send({k:"hi",name:me.name,hue:me.hue});c.send(state())});
  c.on("data",d=>{const p=ensure(c.peer);
    if(d.k==="hi"){p.name=d.name;p.hue=d.hue;toast(`${d.name} ${t("joined")}`)}
    else if(d.k==="s"){Object.assign(p,{x:d.x,y:d.y,sit:d.sit,asleep:d.asleep})}});
  c.on("close",()=>drop(c.peer));
}
function listen(call){call.on("stream",s=>attach(call.peer,s));call.on("close",()=>drop(call.peer))}
function attach(id,s){
  const p=ensure(id);if(p.gain)return;
  const a=new Audio();a.srcObject=s;a.muted=true;a.play().catch(()=>{});   // Chrome needs the element to keep the stream flowing
  p.gain=actx.createGain();p.pan=actx.createStereoPanner();
  actx.createMediaStreamSource(s).connect(p.gain);p.gain.connect(p.pan);p.pan.connect(actx.destination);
}
function drop(id){const p=peers.get(id);if(!p)return;toast(`${p.name} ${t("left")}`);try{p.gain&&p.gain.disconnect()}catch(e){}peers.delete(id)}

/* spatial audio: volume falls off with distance, stereo pan follows left/right offset */
function spatial(){
  peers.forEach(p=>{if(!p.gain)return;
    const dx=p.x-me.x,dy=p.y-me.y,d=Math.hypot(dx,dy)*3,v=Math.max(0,1-d/R)**1.5;
    p.gain.gain.setTargetAtTime(v,actx.currentTime,.05);
    p.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,dx*3/R)),actx.currentTime,.05);
  });
}

/* ---------- the rare feature: sleep when you leave the tab ---------- */
function setSleep(v){me.asleep=v;send(state());document.title=v?"💤 "+t("title"):t("title")}
document.addEventListener("visibilitychange",()=>setSleep(document.hidden));

/* ---------- input ---------- */
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==="e"&&document.activeElement.tagName!=="INPUT")toggleSit()});
addEventListener("keyup",e=>delete keys[e.key.toLowerCase()]);
cv.addEventListener("pointerdown",e=>{const b=cv.getBoundingClientRect();me.tx=(e.clientX-b.left)/b.width*W;me.ty=(e.clientY-b.top)/b.height*H});
function toggleSit(){
  if(me.sit){me.sit=false;return}
  let best=null,bd=26;desks.forEach(d=>{const s=seat(d),k=Math.hypot(s.x-me.x,s.y-me.y);if(k<bd){bd=k;best=s}});
  if(best){me.x=best.x;me.y=best.y;me.sit=true;me.tx=null}
}
$("bSit").onclick=toggleSit;
$("bZz").onclick=e=>{e.target.classList.toggle("on");setSleep(e.target.classList.contains("on"))};
$("bMic").onclick=e=>{me.muted=!me.muted;stream.getAudioTracks().forEach(tr=>tr.enabled=!me.muted);e.target.classList.toggle("on",me.muted);e.target.textContent=me.muted?t("mute"):t("micOn")};
$("bLang").onclick=$("lobbyLang").onclick=()=>{L=L==="ar"?"en":"ar";applyLang()};

/* ---------- pixel art ---------- */
const rect=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
function room_bg(){
  for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16)rect(x,y,16,16,((x+y)/16)%2?"#5a4a78":"#4f4070");
  rect(0,0,W,44,"#352a55");rect(0,40,W,4,"#2a2142");
  for(let i=0;i<4;i++){const x=24+i*76;rect(x,8,36,26,"#1b2a49");rect(x+2,10,32,22,"#2e4a7d");rect(x+17,10,2,22,"#1b2a49");rect(x+6,14,3,3,"#ffe9a8")}
  [[10,52],[296,52],[10,170],[296,170]].forEach(([x,y])=>{rect(x,y+8,10,8,"#a0522d");rect(x+1,y,8,9,"#2f9e6a");rect(x+3,y-3,4,4,"#46c28a")});
}
function desk(d,sleepers){
  const [x,y]=d;rect(x,y,32,14,"#8a5a34");rect(x,y+12,32,3,"#5e3b20");
  rect(x+11,y-8,12,9,"#222");rect(x+12,y-7,10,7,sleepers?"#33364a":"#7fe3ff");rect(x+15,y+1,4,2,"#222");
  rect(x+10,y+17,10,6,"#3d6fa8");                                   // chair
}
function person(p,isMe,tm){
  const x=Math.round(p.x),y=Math.round(p.y),aw=!p.asleep;
  rect(x-5,y-1,10,2,"#0005");
  const body=aw?`hsl(${p.hue},65%,55%)`:`hsl(${p.hue},12%,42%)`;
  const dy=aw?0:3;                                                  // sleeping = slumped head
  rect(x-3,y-8,6,7,body);rect(x-3,y-1,2,1,"#222");rect(x+1,y-1,2,1,"#222");
  rect(x-3,y-14+dy,6,6,"#f1c27d");rect(x-3,y-15+dy,6,2,`hsl(${p.hue},35%,${aw?25:30}%)`);
  if(aw){rect(x-2,y-11,1,1,"#222");rect(x+1,y-11,1,1,"#222")}else{rect(x-2,y-8,2,1,"#222");rect(x+1,y-8,2,1,"#222")}
  g.textAlign="center";g.font="bold 6px system-ui,sans-serif";
  g.fillStyle=isMe?"#ffb454":"#f2e9d8";g.fillText(p.name,x,y-19+dy);
  if(!aw){g.fillStyle="#bde0ff";const f=Math.floor(tm/500)%2;g.font="bold 8px system-ui";
    g.fillText("z",x+8,y-14-f*2);g.font="bold 6px system-ui";g.fillText("Z",x+12,y-20-f*2)}
}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(me.tx!=null&&!dx&&!dy){const ax=me.tx-me.x,ay=me.ty-me.y,d=Math.hypot(ax,ay);if(d<2)me.tx=null;else{dx=ax/d;dy=ay/d}}
  if((dx||dy)&&!me.asleep){me.sit=false;const n=Math.hypot(dx,dy)||1;
    me.x=Math.max(8,Math.min(W-8,me.x+dx/n*70*dt));me.y=Math.max(52,Math.min(H-4,me.y+dy/n*70*dt))}
  acc+=dt;if(acc>.1){acc=0;send(state())}
  spatial();
  g.setTransform(3,0,0,3,0,0);g.imageSmoothingEnabled=false;
  room_bg();

function fitScale(p,pg){const w=pg.closest(".stage").clientWidth||460;return Math.min(3.5,Math.max(1.5,w*Math.max(2,devicePixelRatio||1)/p.getViewport({scale:1}).width))}
const PAL=["#e63946","#ff9f1c","#ffd60a","#2ecc71","#06d6a0","#3a86ff","#8338ec","#ff5fa2","#111111","#ffffff"],r3=v=>Math.round(v*1e3)/1e3;
let tool=null,pcol="#e63946",psz=2,cur=null;
function drawInk(c2,list,cu){const c=c2.getContext("2d"),w=c2.width,h=c2.height;c.clearRect(0,0,w,h);c.lineCap=c.lineJoin="round";
 [...(list||[]),...(cu?[cu]:[])].forEach(s=>{c.globalAlpha=s.a;c.strokeStyle=s.c;c.lineWidth=s.w*w;c.beginPath();s.p.forEach((q,i)=>i?c.lineTo(q[0]*w,q[1]*h):c.moveTo(q[0]*w,q[1]*h));if(s.p.length===1)c.lineTo(s.p[0][0]*w+.1,s.p[0][1]*h);c.stroke()});c.globalAlpha=1}
function eraseAt(l,x,y){if(!l)return false;const n=l.length;for(let i=n-1;i>=0;i--)if(l[i].p.some(q=>Math.hypot(q[0]-x,(q[1]-y)*1.4)<.035))l.splice(i,1);return l.length!==n}
function setTool(t){tool=tool===t?null:t;document.querySelectorAll("[data-tl]").forEach(b=>b.classList.toggle("on",b.dataset.tl===tool));pm.style.pointerEvents=tool?"auto":"none";pm.style.cursor=tool==="er"?"cell":"crosshair";pm.style.touchAction="none"}
document.querySelectorAll("[data-tl]").forEach(b=>b.onclick=()=>setTool(b.dataset.tl));
$("pc").oninput=e=>pcol=e.target.value;$("pz").oninput=e=>psz=+e.target.value;
$("sw").innerHTML=PAL.map(c=>`<button class="sc" data-k="${c}" style="background:${c}" aria-label="${c}"></button>`).join("");
$("sw").onclick=e=>{const b=e.target.closest("button");if(b){pcol=b.dataset.k;$("pc").value=pcol}};
function wipe(q){if(eraseAt(MV.ink[MV.n],q[0],q[1])){drawInk(pm,MV.ink[MV.n]);send({k:"er",p:MV.n,x:q[0],y:q[1]});touch()}}
pm.onpointerdown=e=>{if(!tool)return;pm.setPointerCapture(e.pointerId);const q=nxy(e).map(r3);if(tool==="er")wipe(q);else cur={c:pcol,a:tool==="hl"?.35:1,w:tool==="hl"?.014*psz:.0025*psz,p:[q]}};
pm.onpointermove=e=>{if(!tool||!(e.buttons&1))return;const q=nxy(e).map(r3);if(tool==="er")return wipe(q);if(!cur)return;const l=cur.p[cur.p.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])<.002)return;cur.p.push(q);drawInk(pm,MV.ink[MV.n],cur);touch()};
pm.onpointerup=pm.onpointercancel=()=>{if(!cur)return;(MV.ink[MV.n]=MV.ink[MV.n]||[]).push(cur);send({k:"pen",p:MV.n,s:cur});cur=null;drawInk(pm,MV.ink[MV.n]);touch()};

function exitDlg(){if(busy())return;dlg(`<h3>🚪 ${x("ex_t")}</h3><div style="font-size:34px;font-weight:700" id="xt"></div><div>${x("ex_time")}</div><div>🌳 ${me.pts} · ${me.sec/60|0} ${x("mn")}</div><div class="row"><button class="go" id="xg">${x("ex_go")}</button><button id="xb">${x("ex_back")}</button></div>`,()=>{
 const u=()=>{const e=$("xt");e&&(e.textContent=fmt(el()))};u();const iv=setInterval(()=>{if(!$("xt"))return clearInterval(iv);u()},500);$("xg").onclick=finish;$("xb").onclick=closeDlg})}
$("bEnd").onclick=exitDlg;
function finish(){ended=true;const a=[me,...peers.values()].sort((p,q)=>q.pts-p.pts),r=bookReport(),
 hd=!solo?`<h3>${x("win")}</h3><h2>${av(a[0])}${esc(a[0].name)} · ${a[0].pts}</h2>${a.slice(1).map((p,i)=>`<div>${i+2}. ${esc(p.name)} · ${p.pts}</div>`).join("")}`:`<h3>🌳 ${x("tod")}</h3><h2>${me.pts}</h2>`;
 if(r.b)addPts(r.b);save();
 dlg(`${hd}<div>⏱ ${fmt(S.dur?Math.min(el(),S.dur):el())} · ${me.sec/60|0} ${x("mn")}</div>${r.h}<div class="row"><button class="go" id="fo">${x("ex_out")}</button>${solo?`<button id="fc">${x("cont")}</button>`:""}</div>`,()=>{
 $("fo").onclick=()=>{save();location.reload()};const c=$("fc");if(c)c.onclick=()=>{closeDlg();ended=false}})}
/* group only: earthquakes, falling items, sword, 10-coin */
let IT=[],QK=0,coin15=false;
const isHost=()=>peer&&[pid(),...peers.keys()].sort()[0]===pid(),rid=()=>Math.random().toString(36).slice(2,8);
const addItems=a=>a.forEach(i=>IT.push({...i,lt:now()+i.d,landed:false}));
function spawn(a){a=a.map(i=>({id:rid(),x:20+Math.random()*280|0,y:60+Math.random()*130|0,d:1200,...i}));send({k:"it",a});addItems(a)}
function quake(d){QK=now()+d;toast("⚠️ "+x("eq"))}
function startQuake(){const a=[];for(let i=0;i<8;i++){const r=Math.random();a.push({t:r<.55?"bomb":r<.8?"sword":"coin",d:1500+i*750+(Math.random()*300|0)})}send({k:"eqs",d:7500});quake(7500);spawn(a)}
function slashed(){addPts(-5);me.shock=now()+1500;me.sv-=6;toast("🗡️ -5")}
function useSword(id){const p=peers.get(id);if(!p)return;send({k:"sw",to:id,x:p.x,y:p.y});boom(p.x,p.y);me.sword=false;addPts(5);touch();toast("🗡️ +5");send(state())}
setInterval(()=>{const b=document.body.classList;if(!(b.contains("solo")||b.contains("group")))return;
 $("tm").textContent="⏱ "+fmt(S.dur?Math.max(0,S.dur-el()):el());
 if(solo||!peer||ended||!peers.size||!isHost())return;
 if(S.dur&&!coin15&&el()>S.dur-15000&&el()<S.dur){coin15=true;spawn([{t:"coin"}])}                      // 10-coin 15s before the end
 if(half()){if(Math.random()<.012)startQuake();if(Math.random()<.008&&!IT.some(i=>i.t==="coin"))spawn([{t:"coin"}]);if(Math.random()<.006&&!IT.some(i=>i.t==="sword"))spawn([{t:"sword"}])}},1000);
const _fr=frame;
frame=function(ts){_fr(ts);const n=now();
 cv.style.transform=n<QK?`translate(${(Math.random()-.5)*8}px,${(Math.random()-.5)*8}px)`:"";
 g.setTransform(3,0,0,3,0,0);g.imageSmoothingEnabled=false;
 IT.forEach(i=>{const rem=i.lt-n,w=i.t==="coin"?10:i.t==="bomb"?11:6;

  else if(!i.dead)spr(SP[i.t],i.x,i.y-(i.t==="coin"?Math.abs(Math.sin(n/300))*2:0),w)});
 [me,...peers.values()].forEach(p=>{if(p===me?me.sword:p.sw)spr(SP.sword,p.rx+10,p.ry-1,5)});
 if(n<QK){g.fillStyle=`rgba(230,57,70,${.1+.07*Math.sin(n/90)})`;g.fillRect(0,0,W,H);g.textAlign="center";g.font="bold 8px system-ui";g.fillStyle="#fff";g.fillText("⚠️ "+x("eq"),160,24)}
 IT.forEach(i=>{const d=Math.hypot(me.x-i.x,me.y-i.y);
  if(!i.landed&&n>=i.lt){i.landed=true;if(i.t==="bomb"){boom(i.x,i.y);if(d<13)hurt();i.dead=true}else if(i.t==="sword"&&d<9){addPts(-5);me.shock=n+1200}}
  else if(i.landed&&!i.dead&&n>i.lt+500&&i.t!=="bomb"&&d<9&&!(i.t==="sword"&&me.sword)){i.dead=true;send({k:"ip",id:i.id});if(i.t==="coin"){addPts(10);toast("🪙 +10")}else{me.sword=true;send(state())}touch()}});
 IT=IT.filter(i=>!i.dead&&n<i.lt+25000)};
